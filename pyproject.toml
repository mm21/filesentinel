[project]
authors = [
  {name = "mm21", email = "mm21.dev@gmail.com"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",  # managed by pyprojkit
  "Programming Language :: Python :: 3.12",  # managed by pyprojkit
  "Programming Language :: Python :: 3.13",  # managed by pyprojkit
  "Programming Language :: Python :: 3.14",  # managed by pyprojkit
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2.13.3",
  "pyyaml>=6.0.3",
  "rich>=13.0",
  "typer>=0.12"
]
description = "Integrity monitoring and repair toolkit for long-term file archives"
license = "MIT"
license-files = ["LICENSE"]
name = "filesentinel"
readme = "README.md"
requires-python = ">=3.12,<3.15"  # managed by pyprojkit
version = "0.1.0"

[project.optional-dependencies]
toml = ["tomlkit>=0.13.3,<0.14"]

[project.scripts]
filesentinel = "filesentinel.cli:app"

[project.urls]
homepage = "https://github.com/mm21/filesentinel"

[dependency-groups]
dev = [
  "pyprojkit[all]>=0.3.0,<0.4.0"
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12.0"]

[tool.autoflake]  # managed by pyprojkit
in_place = true
recursive = true
remove-all-unused-imports = true
remove-unused-variables = true

[tool.black]  # managed by pyprojkit
quiet = true
target-version = [
  "py312",
  "py313",
  "py314"
]

[tool.coverage.report]  # managed by pyprojkit
exclude_lines = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.$"
]

[tool.coverage.run]  # managed by pyprojkit
data_file = "__cache__/.coverage"

[tool.docfmt]  # managed by pyprojkit
force-reflow = true
in-place = true
recursive = true
summary-on-own-line = true

[tool.doit]  # managed by pyprojkit
dep_file = "__cache__/.doit.db"
verbosity = 2

[tool.isort]  # managed by pyprojkit
profile = "black"
quiet = true

[tool.nox]  # managed by pyprojkit
default_venv_backend = "uv"
envdir = "__cache__/nox"

[tool.pyprojkit]  # managed by pyprojkit
managed = [
  "tool.autoflake",
  "tool.black",
  "tool.coverage.report",
  "tool.coverage.run",
  "tool.docfmt",
  "tool.doit",
  "tool.isort",
  "tool.nox",
  "tool.pytest.ini_options",
  "tool.tomlsort"
]

[tool.pytest.ini_options]  # managed by pyprojkit
addopts = "--import-mode=importlib -s -v -rA"
cache_dir = "__cache__/pytest"
testpaths = "test"

[tool.tomlsort]  # managed by pyprojkit
sort_first = [
  "project",
  "dependency-groups",
  "build-system"
]
sort_table_keys = true
spaces_before_inline_comment = 2

[tool.uv.sources]
docformatter = {git = "https://github.com/mm21/docformatter.git"}
mkinit = {git = "https://github.com/mm21/mkinit.git"}
